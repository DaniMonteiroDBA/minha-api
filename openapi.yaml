openapi: 3.0.3

info:
  title: API de Gestão de Clientes
  version: "1.0.0"
  description: |
    API para cadastro, consulta, atualização e remoção de clientes.
    O contrato adota a metodologia API First: a interface da API é
    definida e validada antes da implementação.

servers:
  - url: http://localhost:8080/v1
    description: Ambiente de desenvolvimento
  - url: https://api.exemplo.com/v1
    description: Ambiente de produção

tags:
  - name: Clientes
    description: Gestão de clientes

paths:
  /clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      description: Lista os clientes com dados sensíveis parcialmente mascarados.
      operationId: listarClientes
      security:
        - bearerAuth: []
      x-required-scope: clientes.read
      responses:
        "200":
          description: Clientes consultados com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaListaClientes"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "500":
          $ref: "#/components/responses/ErroInterno"

    post:
      tags: [Clientes]
      summary: Cadastrar cliente
      description: Cadastra um cliente usando dados validados.
      operationId: cadastrarCliente
      security:
        - bearerAuth: []
      x-required-scope: clientes.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteEntrada"
      responses:
        "201":
          description: Cliente cadastrado com sucesso
          headers:
            Location:
              description: URI do cliente criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaCliente"
        "400":
          description: Dados enviados em formato inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /clientes/{id}:
    parameters:
      - $ref: "#/components/parameters/ClienteId"

    get:
      tags: [Clientes]
      summary: Consultar cliente por ID
      description: Consulta um cliente com dados sensíveis parcialmente mascarados.
      operationId: consultarClientePorId
      security:
        - bearerAuth: []
      x-required-scope: clientes.read
      responses:
        "200":
          description: Cliente consultado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaCliente"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/ClienteNaoEncontrado"
        "500":
          $ref: "#/components/responses/ErroInterno"

    put:
      tags: [Clientes]
      summary: Atualizar cliente
      description: Atualiza todos os dados editáveis de um cliente existente.
      operationId: atualizarCliente
      security:
        - bearerAuth: []
      x-required-scope: clientes.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteEntrada"
      responses:
        "200":
          description: Cliente atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaCliente"
        "400":
          description: Dados enviados em formato inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/ClienteNaoEncontrado"
        "500":
          $ref: "#/components/responses/ErroInterno"

    delete:
      tags: [Clientes]
      summary: Remover cliente
      description: Remove um cliente existente.
      operationId: removerCliente
      security:
        - bearerAuth: []
      x-required-scope: clientes.delete
      responses:
        "200":
          description: Cliente removido com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaSucessoSemDados"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/ClienteNaoEncontrado"
        "500":
          $ref: "#/components/responses/ErroInterno"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT enviado em Authorization: Bearer {token}."

  parameters:
    ClienteId:
      name: id
      in: path
      required: true
      description: Identificador único do cliente
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 101

  responses:
    NaoAutenticado:
      description: Token JWT ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
    AcessoNegado:
      description: Usuário autenticado sem o scope necessário
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
    ClienteNaoEncontrado:
      description: Cliente não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
    ErroInterno:
      description: Falha inesperada ao processar a requisição
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"

  schemas:
    StatusCliente:
      type: string
      enum: [ATIVO, INATIVO]

    ClienteEntrada:
      type: object
      additionalProperties: false
      required: [nome, cpf, telefone, email, status]
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 150
          example: Ana Carolina Souza
        cpf:
          type: string
          pattern: '^\d{3}\.\d{3}\.\d{3}-\d{2}$'
          description: A expressão valida o formato; os dígitos verificadores devem ser validados pela aplicação.
          example: "123.456.789-00"
        telefone:
          type: string
          minLength: 10
          maxLength: 15
          example: "11987654321"
        email:
          type: string
          format: email
          maxLength: 254
          example: ana.souza@empresa.com
        status:
          $ref: "#/components/schemas/StatusCliente"

    Cliente:
      type: object
      additionalProperties: false
      required: [id, nome, cpf, telefone, email, status, criadoEm]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 101
        nome:
          type: string
          example: Ana Carolina Souza
        cpf:
          type: string
          readOnly: true
          description: CPF parcialmente mascarado
          example: "***.456.789-**"
        telefone:
          type: string
          readOnly: true
          description: Telefone parcialmente mascarado
          example: "(11) *****-4321"
        email:
          type: string
          readOnly: true
          description: E-mail parcialmente mascarado
          example: "a***@empresa.com"
        status:
          $ref: "#/components/schemas/StatusCliente"
        criadoEm:
          type: string
          format: date-time
          readOnly: true
          example: "2026-07-21T14:30:00Z"
        atualizadoEm:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    RespostaCliente:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          $ref: "#/components/schemas/Cliente"

    RespostaListaClientes:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Cliente"

    RespostaSucessoSemDados:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          type: object
          nullable: true
          example: null

    RespostaErro:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
