# Nome exibido na aba "Actions" do GitHub
name: CI/CD — Minha API

# QUANDO executar: a cada push na main
on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente

jobs:


  # ─── JOB 2: Publicar documentação ───
  # Só roda se o job "validar" passou!
  publicar-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Gerar HTML com Redoc
        run: |
          mkdir -p docs
          npx --yes @redocly/cli build-docs openapi.yaml --output docs/index.html

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs